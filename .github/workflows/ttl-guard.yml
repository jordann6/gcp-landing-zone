name: TTL guard

# Hourly watch for a forgotten teardown. In check_only mode it reads live state
# and fails if any hourly-billed resource is still standing; the red scheduled
# run and its notification are the alarm. It changes nothing, so it runs as the
# read-only sa-gha-plan.
#
# Every root that can hold hourly resources is watched, operator-applied or not:
# network/ (NAT, PSC, probe VM), workload/ (GKE, Cloud SQL HA + replica, about
# $10-12 a day if forgotten), compute/ (the management VM) and ci-proof/.
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ttl:
    strategy:
      fail-fast: false
      matrix:
        root: [network, workload, compute, ci-proof]
    permissions:
      contents: read
      id-token: write
    uses: jordann6/platform-guardrails/.github/workflows/tf-destroy.yml@c13311e2cc20b48af292d067e0b936f43116e257 # v1.8.1
    with:
      guardrails_ref: c13311e2cc20b48af292d067e0b936f43116e257
      terraform_dir: ${{ matrix.root }}
      gcp_workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
      gcp_service_account: ${{ vars.GCP_PLAN_SA }}
      check_only: true
