name: Apply (gated)

# Reviewer-gated apply: the just-in-time-to-prod control in CI. The plan job
# federates through the WIF provider as the read-only sa-gha-plan, plans, and
# runs the destroy guard. The apply job is bound to the `prod-apply`
# environment, pauses for a required reviewer, then federates as sa-gha-apply
# and applies the exact saved plan. sa-gha-apply's WIF binding matches on the
# token's environment claim, so a workflow edited to skip the environment gets
# a token that cannot reach it. See bootstrap/wif.tf and tf-apply.yml in
# platform-guardrails.
#
# Only ci-proof/ is applied here. sa-gha-apply holds networking roles in the
# seed project and write on the ci-proof state prefix, nothing else. The other
# roots stay operator-applied as sa-terraform, which CI cannot reach, and
# bootstrap/ owns every identity, so CI can never rewrite its own trust.
#
# Pinned to one platform-guardrails SHA with the tag in a comment, and the same
# SHA is passed as guardrails_ref so the scripts match the reviewed workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    permissions:
      contents: read
      id-token: write
    uses: jordann6/platform-guardrails/.github/workflows/tf-apply.yml@c13311e2cc20b48af292d067e0b936f43116e257 # v1.8.1
    with:
      guardrails_ref: c13311e2cc20b48af292d067e0b936f43116e257
      terraform_dir: ci-proof
      environment: prod-apply
      gcp_workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
      gcp_plan_service_account: ${{ vars.GCP_PLAN_SA }}
      gcp_apply_service_account: ${{ vars.GCP_APPLY_SA }}
