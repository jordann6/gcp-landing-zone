name: Destroy (manual teardown)

# Manual teardown: terraform destroy, then a post-destroy check that fails if any
# hourly-billed resource survived (hourly-guard.sh, which knows the GCP hourly
# types: NAT, forwarding rules, GKE, Cloud SQL, VMs, VPN tunnels). Bound to the
# `destroy` environment, so a teardown is a recorded, approved act. Only that
# environment and prod-apply can federate as sa-gha-apply.
#
# Same scope as apply.yml: ci-proof/ only. Operator-applied roots are torn down
# locally (make destroy, then scripts/verify-teardown.sh).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  destroy:
    permissions:
      contents: read
      id-token: write
    uses: jordann6/platform-guardrails/.github/workflows/tf-destroy.yml@c13311e2cc20b48af292d067e0b936f43116e257 # v1.8.1
    with:
      guardrails_ref: c13311e2cc20b48af292d067e0b936f43116e257
      terraform_dir: ci-proof
      environment: destroy
      gcp_workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
      gcp_service_account: ${{ vars.GCP_APPLY_SA }}
      check_only: false
