# Reference only, not applied by make test.
#
# External Secrets Operator syncing the DB password into a Kubernetes Secret for
# apps that expect one. The IAM side is live (workload_identity.tf grants
# secretAccessor to external-secrets/external-secrets). Installing the operator
# itself needs two things this landing zone deliberately does not grant by
# default: its images live on ghcr.io, which is neither on the egress allowlist
# nor behind an Artifact Registry remote repo, and they would need attestations
# to pass Binary Authorization. Adding a ghcr.io remote repo and signing the
# digests is the path; make test proves the same Workload Identity grant with
# the db-check Job instead.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: ${PROJECT}
      auth:
        workloadIdentity:
          clusterLocation: ${ZONE}
          clusterName: ${CLUSTER}
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-db-password
  namespace: app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: app-db-password
  data:
    - secretKey: password
      remoteRef:
        key: app-db-password
